# Draws the keymap with keymap-drawer (https://github.com/caksoylar/keymap-drawer) whenever it
# changes and commits the picture to keymap-drawer/lotus58.svg (shown in the README).
# After pushing a keymap change, run `git pull` locally to get the drawing commit.
name: Draw keymap

on:
  workflow_dispatch:
  push:
    # Branches only: tag pushes are handled by release.yml
    branches: ["**"]
    paths:
      - "config/lotus58.keymap"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/lotus58.keymap"
